services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
      - "8080:80/tcp"

    volumes:
      - ./workdir:/opt/adguardhome/work
      - ./confdir:/opt/adguardhome/conf
    restart: unless-stopped
    networks:
      - private-net

networks:
  private-net:
    external: true



