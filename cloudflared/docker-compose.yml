services:
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: cloudflared_tunnel
    restart: unless-stopped
    volumes:
      - ./config:/home/nonroot/ .cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - private-net

networks:
  private-net:
    external: true
