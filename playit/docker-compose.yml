services:
  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.16
    container_name: playit-agent
    environment:
      # Secret key diambil dari file .env (lihat .env.example)
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      # Data playit disimpan di folder ini (lokal)
      - ./playit-data:/data
    networks:
      - game-net # WAJIB SAMA dengan network minecraft
    restart: unless-stopped

# Panggil network yang sudah dibuat manual
networks:
  game-net:
    external: true

