services:
  npm:
    image: 'jc21/nginx-proxy-manager:2.13.5'
    container_name: npm
    restart: unless-stopped

    ports:
      - '80:80/tcp'
      - '443:443/tcp'
      - '81:81/tcp'

    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

    networks:
      - private-net

networks:
  private-net:
    external: true

